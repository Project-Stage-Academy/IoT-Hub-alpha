openapi: 3.0.3
info:
  title: Industry 4.0 IoT
  version: 1.0.0
  license:
    name: Apache License 2.0
    url: https://opensource.org/license/apache-2-0
  contact:
    name: "Api Owner"
    url: "http://www.example-industry.com"
    email: "support@industry.com"
  description: IoT Service for industrial use
tags:
  - name: devices
    description: Devices reporting telemetry data
  - name: telemetry
    description: Telemetry ingestion and retrieval
  - name: auth
    description: Authentication control
security:
  - BearerAuth: []
servers:
  - url: /api/v1
paths:
  /telemetry:
    get:
      description: get telemetry data
      summary: Get paginated telemetry data
      operationId: TelemetryList
      tags: [telemetry]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: device_id
          in: query
          description: Get telemetry data of specific device by uuid
          schema:
            type: string
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      responses:
        "200":
          description: Page of telemetry data (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      security: []
      description: |
        Submit single or batched telemetry data for ingestion.

        **Schema Versioning:**
        - `schema_version` is required and must be specified for all payloads
        - Current supported versions: `1.0`
        - Schema version is stored in the JSONB payload for future migration compatibility

        **Idempotency:**
        - Optional `Idempotency-Key` header can be provided for request deduplication
        - Key is echoed back in the response but not enforced server-side in MVP

        **Ingestion Mode:**
        - Controlled by `TELEMETRY_ASYNC_INGESTION`
        - `false` (sync): validates and inserts into DB in request thread (uses `bulk_create` for batch)
        - `true` (async): validates and queues to Celery, returns immediately (no DB writes in request thread)

        **Batch Constraints:**
        - Maximum batch size: 1000 records (configurable via `TELEMETRY_MAX_BATCH_SIZE`)
        - All-or-nothing semantics: if any record fails validation, entire batch is rejected
      summary: Ingest telemetry data
      operationId: TelemetrySubmit
      tags: [telemetry]
      parameters:
        - name: X-Device-Serial-Number
          in: header
          required: true
          description: Serial number of the device submitting telemetry
          schema:
            type: string
          example: "SN123456"
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional idempotency key for request deduplication
          schema:
            type: string
          example: "unique-client-request-id-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TelemetryPost"
                - $ref: "#/components/schemas/TelemetryBatchPost"
            examples:
              single:
                summary: Single telemetry record
                value:
                  schema_version: "1.0"
                  value: 25.5
              batch:
                summary: Batch of telemetry records
                value:
                  - schema_version: "1.0"
                    value: 25.5
                  - schema_version: "1.0"
                    value: 26.0
      responses:
        "201":
          description: Telemetry created (sync mode)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TelemetryCreatedSingle"
                  - $ref: "#/components/schemas/TelemetryCreatedBatch"
              examples:
                single:
                  summary: Single record created
                  value:
                    status: "created"
                    id: 12345
                    device_id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
                    timestamp: "2026-02-03T12:37:27.594815+00:00"
                batch:
                  summary: Batch created
                  value:
                    status: "created"
                    count: 3
                    ids: [12345, 12346, 12347]
                    summary:
                      total: 3
                      successful: 3
                      failed: 0
        "202":
          description: Telemetry accepted for processing (async mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryAcceptedAsync"
              examples:
                accepted:
                  summary: Single or batch accepted
                  value:
                    status: "accepted"
                    request_id: "a3f5b8c2-1234-5678-90ab-cdef12345678"
                    count: 150
                    task_id: "b4d2b6fa-1111-2222-3333-444455556666"
        "400":
          description: Bad request - validation errors or batch issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryError"
              examples:
                invalid_json:
                  summary: Invalid JSON
                  value:
                    error: "Invalid JSON payload"
                validation_error:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    details:
                      schema_version: ["This field is required."]
                batch_failed:
                  summary: Batch ingestion failed
                  value:
                    error: "Batch ingestion failed"
                    details:
                      summary:
                        total: 3
                        successful: 0
                        failed: 1
                      errors:
                        - index: 1
                          error: "Validation failed"
  /devices:
    get:
      description: get list of devices
      summary: Get paginated device data
      operationId: DeviceList
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: a paginated list of all devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      description: create a new device
      summary: Create a new device
      operationId: DeviceSubmit
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /devices/{id}:
    get:
      description: get a specific device by id
      summary: Get a specific device based on ID in URL path
      operationId: DeviceGet
      tags: [devices]
      parameters:
        - name: id
          in: path
          required: true
          description: get telemetry data of specific device by id
          schema:
            type: string
            example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      responses:
        "200":
          description: device information by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      description: update a device partially
      summary: Update device
      operationId: DeviceUpdate
      tags: [devices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    delete:
      description: delete a device
      summary: Delete device
      operationId: DeviceDelete
      tags: [devices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      responses:
        "204":
          description: device deleted
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /rules:
    get:
      description: get list of rules
      summary: Get paginated rule data
      operationId: RuleList
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: a paginated list of rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      description: create a new rule
      summary: Create a new rule
      operationId: RuleSubmit
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCreate"
      responses:
        "201":
          description: rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rules"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /rules/{id}:
    get:
      description: get a specific rule by id
      summary: Get a specific rule based on id in url paths
      operationId: RuleGet
      tags: [rules]
      parameters:
        - name: id
          in: path
          required: true
          description: Get rule data of specific rule by id
          schema:
            type: string
            example: 29e31015-4733-49f3-855a-ef7f30e6c147
      responses:
        "200":
          description: rule information by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rules"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      description: update a rule to enable/disable it
      summary: Update activation of rule
      operationId: RulePatch
      tags: [rules]
      parameters:
        - name: id
          in: path
          required: true
          description: Get rule data of specific rule by id
          schema:
            type: string
            example: 29e31015-4733-49f3-855a-ef7f30e6c147
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: enable or disable rules
                  example: true
      responses:
        "200":
          description: rule is_active enabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rules"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      description: delete a rule by id
      summary: Delete a specific rule based by id
      operationId: RuleDelete
      tags: [rules]
      parameters:
        - name: id
          in: path
          required: true
          description: Get rule data of specific rule by id
          schema:
            type: string
            example: 29e31015-4733-49f3-855a-ef7f30e6c147
      responses:
        "204":
          description: rule successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rules"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/fake:
    get: 
      security: []
      description: fake jwt token
      summary: Obtain a test token
      operationId: TokenFake
      tags: [auth]
      responses:
        "200":
          description: get a fake token
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/FakeToken"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access tokens expire after 60min.  Obtain via /auth endpoint."
  parameters:
    PageParam:
      name: page
      in: query
      description: page number (1-based)
      schema:
        type: integer
        minimum: 1
      example: 1
    PageSizeParam:
      name: page_size
      in: query
      description: number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      example: 10
  schemas:
    PaginationMeta:
      type: object
      required: [page, page_size, total, total_pages, next_page, prev_page]
      properties:
        page:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 10
        total:
          type: integer
          description: Total number of items matching the query
          example: 134
        total_pages:
          type: integer
          description: Total pages available (derived from total/page_size)
          example: 14
        next_page:
          type: integer
          nullable: true
          description: Next page number if available, otherwise null
          example: 3
        prev_page:
          type: integer
          nullable: true
          description: Previous page number if available, otherwise null
          example: 1
    TelemetryListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Telemetry"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    DeviceListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Some error has occured
    FakeToken:
      type: object
      required: [fakejwt]
      properties: 
        fakejwt:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyLCJleHAiOjE3MTYyMzkwMjJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    Telemetry:
      type: object
      required:
        - ssn
        - value
        - metric
        - ts
      properties:
        ssn:
          type: string
          description: "Device serial number (must match a registered device)"
          example: SN2224412
        value:
          type: number
          format: float
          example: 24.32
        metric:
          type: string
          example: C
        ts:
          type: string
          format: date-time
          example: "2026-01-16T22:53:00Z"
    TelemetryPost:
      type: object
      required:
        - schema_version
      properties:
        schema_version:
          type: string
          description: "Telemetry payload schema version. Supported: 1.0"
          example: "1.0"
        value:
          type: number
          format: float
          description: Optional numeric value to extract and store in payload
          example: 25.5
        timestamp:
          type: string
          format: date-time
          description: Optional timestamp (ISO 8601). If omitted, server time is used.
          example: "2024-01-15T10:30:00Z"
    TelemetryBatchPost:
      type: array
      description: Array of telemetry records for batch ingestion
      items:
        $ref: "#/components/schemas/TelemetryPost"
      minItems: 1
      maxItems: 1000
    TelemetryCreatedSingle:
      type: object
      required:
        - status
        - id
        - device_id
        - timestamp
      properties:
        status:
          type: string
          enum: [created]
          example: "created"
        id:
          type: integer
          example: 12345
        device_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-03T12:37:27.594815+00:00"
        idempotency_key:
          type: string
          description: Echoed idempotency key if provided in request
          example: "unique-client-request-id-123"
    TelemetryCreatedBatch:
      type: object
      required:
        - status
        - count
        - ids
        - summary
      properties:
        status:
          type: string
          enum: [created]
          example: "created"
        count:
          type: integer
          example: 3
        ids:
          type: array
          items:
            type: integer
          example: [12345, 12346, 12347]
        summary:
          type: object
          required: [total, successful, failed]
          properties:
            total:
              type: integer
              example: 3
            successful:
              type: integer
              example: 3
            failed:
              type: integer
              example: 0
        idempotency_key:
          type: string
          description: Echoed idempotency key if provided in request
          example: "unique-client-request-id-123"
    TelemetryAcceptedAsync:
      type: object
      required:
        - status
        - request_id
        - count
      properties:
        status:
          type: string
          enum: [accepted]
          example: "accepted"
        request_id:
          type: string
          format: uuid
          description: Request UUID for ingestion tracking
          example: "a3f5b8c2-1234-5678-90ab-cdef12345678"
        count:
          type: integer
          description: Number of records accepted (1 for single payload)
          example: 150
        task_id:
          type: string
          description: Celery task ID (optional)
          example: "b4d2b6fa-1111-2222-3333-444455556666"
        idempotency_key:
          type: string
          description: Echoed idempotency key if provided in request
          example: "unique-client-request-id-123"
    TelemetryError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: object
          description: Detailed error information
    RuleCreate:
      type: object
      required:
        - name
        - description
        - comparison_operator
        - condition
        - is_enabled
        - device_id
      properties:
        name:
          type: string
          example: Low Vibration Alert Lathe
        description:
          type: string
          description: "Device serial number (must match a registered device)"
          example: Alerts maintenance when vibration drops below expected operating range
        condition:
          type: object
          description: Condition json description
          additionalProperties: true
          example:
            type: leaf
            operator: gt
            threshold: 5
            window_seconds: 15
            occurances: 3
        action_config:
          type: array
          description: List of action configuration objects
          items:
            type: object
            additionalProperties: true
          example:
            - type: notification
              recipients: ["test@test.com"]
              template_id: 5
            - type: stop_machine
              machine_id: CNC-002
        is_enabled:
          type: boolean
          description: is the rule enabled
          example: true
        device_id:
          type: string
          description: UUID of device ID assosiated with the rule
          example: a80031eb-189a-49d5-93ab-11bd465143e9
    Rules:
      type: object
      required:
        - name
        - description
        - comparison_operator
        - condition
        - last_triggered_at
        - is_enabled
      properties:
        name:
          type: string
          example: Low Vibration Alert Lathe
        description:
          type: string
          description: "Device serial number (must match a registered device)"
          example: Alerts maintenance when vibration drops below expected operating range
        condition:
          type: object
          description: Condition json description
          additionalProperties: true
          example:
            type: leaf
            operator: gt
            threshold: 5
            window_seconds: 15
            occurances: 3
        action_config:
          type: array
          description: List of action configuration objects
          items:
            type: object
            additionalProperties: true
          example:
            - type: notification
              recipients: ["test@test.com"]
              template_id: 5
            - type: stop_machine
              machine_id: CNC-002
        last_triggered_at:
          type: string
          format: date-time
          example: 2026-01-16T17:30:00Z
        is_enabled:
          type: boolean
          description: is the rule enabled
          example: true
    Device:
      type: object
      required:
        - id
        - device_type_id
        - name
        - serial_number
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 5d0e2855-738d-4ed8-8fbf-7c8d9d2329c5
        device_type_id:
          type: string
          format: uuid
          example: 7ca821df-4d26-4eb6-bd4f-426b6e2f08c8
        name:
          type: string
          example: Sensor 1
        serial_number:
          type: string
          example: SN-001
        location:
          type: string
          nullable: true
          example: Lab
        status:
          type: string
          enum: [active, inactive, error]
          example: active
        last_seen:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-27T20:58:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-01-27T20:57:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-27T21:10:00Z"

    DeviceCreate:
      type: object
      required:
        - device_type_id
        - name
        - serial_number
      properties:
        device_type_id:
          type: string
          format: uuid
          example: 7ca821df-4d26-4eb6-bd4f-426b6e2f08c8
        name:
          type: string
          example: Sensor 1
        serial_number:
          type: string
          example: SN-001
        location:
          type: string
          nullable: true
          example: Lab
        status:
          type: string
          enum: [active, inactive, error]
          example: active

    DeviceUpdate:
      type: object
      description: Partial update (all fields optional)
      properties:
        device_type_id:
          type: string
          format: uuid
          example: 7ca821df-4d26-4eb6-bd4f-426b6e2f08c8
        name:
          type: string
          example: Sensor 1
        serial_number:
          type: string
          example: SN-001
        location:
          type: string
          nullable: true
          example: Lab
        status:
          type: string
          enum: [active, inactive, error]
          example: inactive

    DeviceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Device"
    RuleListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rules"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
  responses:
    UnauthorizedError:
      description: No or invalid JWT token provided
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"