openapi: 3.0.3
info:
  title: Industry 4.0 IoT
  version: 1.0.0
  license:
    name: Apache License 2.0
    url: https://opensource.org/license/apache-2-0
  contact:
    name: "Api Owner"
    url: "http://www.example-industry.com"
    email: "support@industry.com"
  description: IoT Service for industrial use
tags:
  - name: rules
    description: Rule sets to assess telemetry data
  - name: devices
    description: Devices reporting telemetry data
  - name: telemetry
    description: Telemetry ingestion and retrieval
  - name: auth
    description: Authentication control
  - name: events
    description: Rule-triggered events
security:
  - BearerAuth: []
servers:
  - url: /api/v1
paths:
  /telemetry:
    get:
      description: get telemetry data
      summary: Get paginated telemetry data
      operationId: TelemetryList
      tags: [telemetry]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: device_id
          in: query
          description: Get telemetry data of specific device by uuid
          schema:
            type: string
            format: uuid
            example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      responses:
        "200":
          description: Page of telemetry data (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      security: []
      description: |
        Submit single or batched telemetry data for ingestion.

        **Headers and Identity:**
        - `X-Device-Serial-Number` is required and identifies the source device
        - `serial_number` in body is ignored/overwritten by header value
        - legacy body field `ssn` is removed if present

        **Schema Versioning and Value:**
        - `schema_version` is required (supported: `1.0`)
        - `value` is optional; when provided it can be number or numeric string
        - for `schema_version=1.0`, value is normalized with `/100` before persistence/routing

        **Idempotency:**
        - optional `Idempotency-Key` header can be provided
        - if omitted, a deterministic key is generated from header serial + request payload
        - key is echoed in success responses

        **Batch Constraints:**
        - Maximum batch size: 1000 records (configurable via `TELEMETRY_MAX_BATCH_SIZE`)
        - All-or-nothing semantics: if any record fails validation, entire batch is rejected

        **Pipeline Modes:**
        - `TELEMETRY_PIPELINE_MODE=direct` + `TELEMETRY_ASYNC_INGESTION=false` -> `201 Created` (written in request thread)
        - `TELEMETRY_PIPELINE_MODE=direct` + `TELEMETRY_ASYNC_INGESTION=true` -> `202 Accepted` (queued to Celery)
        - `TELEMETRY_PIPELINE_MODE=kafka` -> `202 Accepted` (published to Kafka raw topic)
      summary: Ingest telemetry data
      operationId: TelemetrySubmit
      tags: [telemetry]
      parameters:
        - name: X-Device-Serial-Number
          in: header
          required: true
          description: Serial number of the device submitting telemetry
          schema:
            type: string
          example: "TEMP-SN-002"
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional idempotency key. If omitted, the server generates one.
          schema:
            type: string
          example: "unique-client-request-id-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TelemetryPost"
                - $ref: "#/components/schemas/TelemetryBatchPost"
            examples:
              single:
                summary: Single telemetry record
                value:
                  schema_version: "1.0"
                  value: 2550
                  timestamp: "2026-02-28T12:30:45Z"
              batch:
                summary: Batch of telemetry records
                value:
                  - schema_version: "1.0"
                    value: 2550
                  - schema_version: "1.0"
                    value: "2630"
      responses:
        "201":
          description: Telemetry created (direct sync mode)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TelemetryCreatedSingle"
                  - $ref: "#/components/schemas/TelemetryCreatedBatch"
              examples:
                single:
                  summary: Single record created
                  value:
                    status: "created"
                    id: 12345
                    device_id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
                    timestamp: "2026-02-03T12:37:27.594815+00:00"
                    idempotency_key: "http:ab12cd34ef56..."
                batch:
                  summary: Batch created
                  value:
                    status: "created"
                    count: 3
                    ids: [12345, 12346, 12347]
                    summary:
                      total: 3
                      successful: 3
                      failed: 0
                    idempotency_key: "http:ab12cd34ef56..."
        "202":
          description: Telemetry accepted (direct async or kafka pipeline mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryAcceptedAsync"
              examples:
                accepted_async:
                  summary: Accepted in direct async mode
                  value:
                    status: "accepted"
                    request_id: "a3f5b8c2-1234-5678-90ab-cdef12345678"
                    count: 1
                    task_id: "b4d2b6fa-1111-2222-3333-444455556666"
                    idempotency_key: "unique-client-request-id-123"
                accepted_kafka:
                  summary: Accepted in kafka pipeline mode
                  value:
                    status: "accepted"
                    request_id: "a3f5b8c2-1234-5678-90ab-cdef12345678"
                    count: 2
                    task_id: "kafka"
                    idempotency_key: "http:ab12cd34ef56..."
                    topic: "telemetry.raw"
                    pipeline_mode: "kafka"
        "400":
          description: Bad request - validation errors or batch issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryError"
              examples:
                invalid_json:
                  summary: Invalid JSON
                  value:
                    error: "Invalid JSON payload"
                validation_error:
                  summary: Validation error
                  value:
                    error: "Validation failed"
                    details:
                      schema_version: ["This field is required."]
                batch_failed:
                  summary: Batch ingestion failed
                  value:
                    error: "Batch ingestion failed"
                    details:
                      summary:
                        total: 3
                        successful: 0
                        failed: 1
                      errors:
                        - index: 1
                          error: "Validation failed"
        "409":
          description: Conflict, typically duplicate idempotency constraint in direct sync mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryError"
              example:
                error: "Processing failed"
        "500":
          description: Internal processing failure (database or unexpected error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryError"
              example:
                error: "Processing failed"
        "503":
          description: Temporary upstream unavailability (e.g. Kafka publish failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryError"
              example:
                error: "Kafka publish failed"
  /devices:
    get:
      description: get list of devices
      summary: Get paginated device data
      operationId: DeviceList
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: a paginated list of all devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      description: create a new device
      summary: Create a new device
      operationId: DeviceSubmit
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: device created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /devices/{id}:
    get:
      description: get a specific device by id
      summary: Get a specific device based on ID in URL path
      operationId: DeviceGet
      tags: [devices]
      parameters:
        - name: id
          in: path
          required: true
          description: get telemetry data of specific device by id
          schema:
            type: string
            example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      responses:
        "200":
          description: device information by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      description: update a device partially
      summary: Update device
      operationId: DeviceUpdate
      tags: [devices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: device updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    delete:
      description: delete a device
      summary: Delete device
      operationId: DeviceDelete
      tags: [devices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: a1b2c3d4-e5f6-7890-1234-567890abcdef
      responses:
        "204":
          description: device deleted
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /rules:
    get:
      description: get list of rules
      summary: Get paginated rule data
      operationId: RuleList
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: a paginated list of rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      description: create a new rule
      summary: Create a new rule
      operationId: RuleSubmit
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCreate"
            examples:
              create:
                value:
                  name: "Low Vibration Alert Lathe"
                  description: "Alerts maintenance when vibration drops below expected operating range"
                  condition:
                    type: leaf
                    operator: gt
                    threshold: 5
                    window_seconds: 15
                    occurances: 3
                  action_config:
                    - type: notification
                      recipients: ["test@test.com"]
                      template_id: 5
                  is_enabled: true
                  device_id: "a80031eb-189a-49d5-93ab-11bd465143e9"
      responses:
        "201":
          description: rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rules"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /rules/inbound/{inbound_id}:
    post:
      description: Trigger external rule/event
      summary: Triggeres an external event
      operationId: InboundRule
      tags: [rules]
      parameters:
        - name: inbound_id
          in: path
          required: true
          description: Get rule data of specific rule by id
          schema:
            type: string
            example: "1234"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Transformed rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundRules"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /rules/{id}:
    get:
      description: get a specific rule by id
      summary: Get a specific rule based on id in url paths
      operationId: RuleGet
      tags: [rules]
      parameters:
        - name: id
          in: path
          required: true
          description: Get rule data of specific rule by id
          schema:
            type: string
            example: 29e31015-4733-49f3-855a-ef7f30e6c147
      responses:
        "200":
          description: rule information by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rules"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      description: update a rule to enable/disable it
      summary: Update activation of rule
      operationId: RulePatch
      tags: [rules]
      parameters:
        - name: id
          in: path
          required: true
          description: Get rule data of specific rule by id
          schema:
            type: string
            example: 29e31015-4733-49f3-855a-ef7f30e6c147
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  example: true
            examples:
              enable:
                value: { "enabled": true }
              disable:
                value: { "enabled": false }
      responses:
        "200":
          description: rule is_active enabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rules"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      description: delete a rule by id
      summary: Delete a specific rule based by id
      operationId: RuleDelete
      tags: [rules]
      parameters:
        - name: id
          in: path
          required: true
          description: Get rule data of specific rule by id
          schema:
            type: string
            example: 29e31015-4733-49f3-855a-ef7f30e6c147
      responses:
        "204":
          description: rule successfully deleted
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/fake:
    get: 
      security: []
      description: fake jwt token
      summary: Obtain a test token
      operationId: TokenFake
      tags: [auth]
      responses:
        "200":
          description: get a fake token
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/FakeToken"
        "400":
          $ref: "#/components/responses/BadRequest"
  /events:
    get:
      description: get list of events (requires events.view_event permission)
      summary: Get paginated event data
      operationId: EventList
      tags: [events]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: device_id
          in: query
          description: Filter events by device UUID
          schema:
            type: string
            format: uuid
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        - name: device
          in: query
          description: Alias for device_id
          schema:
            type: string
            format: uuid
        - name: rule_id
          in: query
          description: Filter events by rule UUID
          schema:
            type: string
            format: uuid
          example: 29e31015-4733-49f3-855a-ef7f30e6c147
        - name: rule
          in: query
          description: Alias for rule_id
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          description: Filter events by severity
          schema:
            type: string
            enum: [critical, warning, info]
          example: warning
        - name: acknowledged
          in: query
          description: Filter by acknowledged status (true means status != new)
          schema:
            type: string
            enum: ["1", "0", "true", "false", "yes", "no"]
          example: "true"
      responses:
        "200":
          description: Page of events (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/{event_id}:
    get:
      description: get a specific event by id (requires events.view_event permission)
      summary: Get a specific event by id
      operationId: EventGet
      tags: [events]
      parameters:
        - name: event_id
          in: path
          required: true
          description: Event numeric id
          schema:
            type: integer
            format: int64
          example: 321
      responses:
        "200":
          description: event information by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/{event_id}/ack:
    post:
      description: acknowledge an event (requires events.change_event permission)
      summary: Acknowledge an event
      operationId: EventAcknowledge
      tags: [events]
      parameters:
        - name: event_id
          in: path
          required: true
          description: Event numeric id
          schema:
            type: integer
            format: int64
          example: 321
      responses:
        "200":
          description: event acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/{event_id}/resolve:
    post:
      description: resolve an event (requires events.change_event permission)
      summary: Resolve an event
      operationId: EventResolve
      tags: [events]
      parameters:
        - name: event_id
          in: path
          required: true
          description: Event numeric id
          schema:
            type: integer
            format: int64
          example: 321
      responses:
        "200":
          description: event resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access tokens expire after 60min.  Obtain via /auth endpoint."
  parameters:
    PageParam:
      name: page
      in: query
      description: page number (1-based)
      example: 1
      schema:
        type: integer
        minimum: 1
        example: 1
    PageSizeParam:
      name: page_size
      in: query
      description: number of items per page
      example: 1
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        example: 10
  schemas:
    PaginationMeta:
      type: object
      required: [page, page_size, total, total_pages, next_page, prev_page]
      properties:
        page:
          type: integer
          example: 2
        page_size:
          type: integer
          example: 10
        total:
          type: integer
          description: Total number of items matching the query
          example: 134
        total_pages:
          type: integer
          description: Total pages available (derived from total/page_size)
          example: 14
        next_page:
          type: integer
          nullable: true
          description: Next page number if available, otherwise null
          example: 3
        prev_page:
          type: integer
          nullable: true
          description: Previous page number if available, otherwise null
          example: 1
    TelemetryListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Telemetry"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    DeviceListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Some error has occured
    FakeToken:
      type: object
      required: [fakejwt]
      properties: 
        fakejwt:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyLCJleHAiOjE3MTYyMzkwMjJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    Telemetry:
      type: object
      required:
        - id
        - device_id
        - timestamp
        - payload
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        device_id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        timestamp:
          type: string
          format: date-time
          example: "2026-02-28T12:30:45Z"
        payload:
          $ref: "#/components/schemas/TelemetryPayloadStored"
    TelemetryPayloadStored:
      type: object
      required:
        - schema_version
        - serial_number
      properties:
        schema_version:
          type: string
          enum: ["1.0"]
          example: "1.0"
        serial_number:
          type: string
          description: Device serial copied from `X-Device-Serial-Number`
          example: "TEMP-SN-002"
        value:
          type: number
          description: Normalized numeric value (schema 1.0 currently divides raw input by 100)
          example: 25.5
    TelemetryPost:
      type: object
      required:
        - schema_version
      properties:
        schema_version:
          type: string
          description: "Telemetry payload schema version. Supported: 1.0"
          enum: ["1.0"]
          example: "1.0"
        value:
          oneOf:
            - type: number
            - type: string
          description: Optional raw numeric value. Numeric strings are accepted.
          example: 2550
        timestamp:
          type: string
          format: date-time
          description: Optional timestamp (ISO 8601). If omitted, server time is used.
          example: "2024-01-15T10:30:00Z"
      additionalProperties: true
    TelemetryBatchPost:
      type: array
      description: Array of telemetry records for batch ingestion
      items:
        $ref: "#/components/schemas/TelemetryPost"
      minItems: 1
      maxItems: 1000
    TelemetryCreatedSingle:
      type: object
      required:
        - status
        - id
        - device_id
        - timestamp
      properties:
        status:
          type: string
          enum: [created]
          example: "created"
        id:
          type: integer
          example: 12345
        device_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-03T12:37:27.594815+00:00"
        idempotency_key:
          type: string
          description: Echoed idempotency key if provided in request
          example: "unique-client-request-id-123"
    TelemetryCreatedBatch:
      type: object
      required:
        - status
        - count
        - ids
        - summary
      properties:
        status:
          type: string
          enum: [created]
          example: "created"
        count:
          type: integer
          example: 3
        ids:
          type: array
          items:
            type: integer
          example: [12345, 12346, 12347]
        summary:
          type: object
          required: [total, successful, failed]
          properties:
            total:
              type: integer
              example: 3
            successful:
              type: integer
              example: 3
            failed:
              type: integer
              example: 0
        idempotency_key:
          type: string
          description: Echoed idempotency key if provided in request
          example: "unique-client-request-id-123"
    TelemetryAcceptedAsync:
      type: object
      required:
        - status
        - request_id
        - count
      properties:
        status:
          type: string
          enum: [accepted]
          example: "accepted"
        request_id:
          type: string
          format: uuid
          description: Request UUID for ingestion tracking
          example: "a3f5b8c2-1234-5678-90ab-cdef12345678"
        count:
          type: integer
          description: Number of records accepted (1 for single payload)
          example: 150
        task_id:
          type: string
          description: Celery task ID (direct async) or literal `kafka` in kafka pipeline mode
          example: "b4d2b6fa-1111-2222-3333-444455556666"
        idempotency_key:
          type: string
          description: Effective idempotency key (header value or generated server key)
          example: "unique-client-request-id-123"
        topic:
          type: string
          description: Kafka topic (present when `TELEMETRY_PIPELINE_MODE=kafka`)
          example: "telemetry.raw"
        pipeline_mode:
          type: string
          description: Pipeline mode when included in response
          example: "kafka"
    TelemetryError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: object
          description: Detailed error information
    RuleCreate:
      type: object
      required:
        - name
        - description
        - condition
        - is_enabled
        - device_id
      properties:
        name:
          type: string
          example: Low Vibration Alert Lathe
        description:
          type: string
          description: "Device serial number (must match a registered device)"
          example: Alerts maintenance when vibration drops below expected operating range
        condition:
          type: object
          description: Condition json description
          additionalProperties: true
          example:
            type: leaf
            operator: gt
            threshold: 5
            window_seconds: 15
            occurances: 3
        action_config:
          type: array
          description: List of action configuration objects
          items:
            type: object
            additionalProperties: true
          example:
            - type: notification
              recipients: ["test@test.com"]
              template_id: 5
            - type: stop_machine
              machine_id: CNC-002
        is_enabled:
          type: boolean
          description: is the rule enabled
          example: true
        device_id:
          type: string
          description: UUID of device ID assosiated with the rule
          example: a80031eb-189a-49d5-93ab-11bd465143e9
    InboundRules:
      type: object
      additionalProperties: false
      required:
        - type
        - rule_id
        - device_id
        - timestamp
        - severy
        - message
        - execution_results
        - telemetry_snapshot
        - action_config
        - notifications
        - cooldown_min

      properties:
        type:
          type: string
          description: Event source/type marker.
          example: external

        rule_id:
          type: string
          description: Rule identifier.
          example: "133322"

        device_id:
          type: string
          description: Device identifier.
          example: "6652"

        timestamp:
          type: string
          format: date-time
          description: Event timestamp (ISO 8601).
          example: "2026-02-28T08:59:47.720763+00:00"

        severy:
          type: string
          description: Severity level.
          example: warning

        message:
          type: string
          description: Human-readable message.
          example: Rule triggered

        execution_results:
          type: array
          description: Execution results from rule evaluation.
          items: {}
          example: []

        telemetry_snapshot:
          type: object
          additionalProperties: true
          description: |
            Free-form telemetry snapshot.
            Structure depends on device schema and is not validated at API level.
          example:
            value: 15
            ts: "2026-02-28T09:02:55.979981+00:00"
            temperature: 21.5
            battery: 87

        action_config:
          type: array
          description: Free-form list of action configurations.
          items: {}
          example:
            - type: email
              to: bob@gmail.com
              name: bob

        notifications:
          type: array
          description: Free-form list of generated notifications.
          items: {}
          example: []

        cooldown_min:
          type: integer
          minimum: 0
          description: Cooldown period in minutes.
          example: 25
    Event:
      type: object
      required:
        - id
        - rule_id
        - device_id
        - severity
        - message
        - status
        - acknowledged
        - fired_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
          example: 321
        rule_id:
          type: string
          format: uuid
          example: 29e31015-4733-49f3-855a-ef7f30e6c147
        device_id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        severity:
          type: string
          enum: [critical, warning, info]
          example: warning
        message:
          type: string
          example: "Warning: Device-01 temperature 84.3C"
        status:
          type: string
          enum: [new, acknowledged, resolved]
          example: acknowledged
        acknowledged:
          type: boolean
          description: true when status != new
          example: true
        fired_at:
          type: string
          format: date-time
          example: "2026-02-08T18:22:31Z"
        created_at:
          type: string
          format: date-time
          example: "2026-02-08T18:22:31Z"
        execution_results:
          type: array
          items:
            type: object
          example:
            - type: notification
              template_id: 5
              status: completed
        telemetry_snapshot:
          type: object
          nullable: true
          example:
            device_id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
            timestamp: "2026-02-08T18:22:00Z"
            payload:
              value: 84.3
        payload:
          type: object
          nullable: true
          example:
            value: 84.3
    EventResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Event"
    EventListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    Rules:
      type: object
      required:
        - name
        - description
        - condition
        - last_triggered_at
        - is_enabled
      properties:
        name:
          type: string
          example: Low Vibration Alert Lathe
        description:
          type: string
          description: "Device serial number (must match a registered device)"
          example: Alerts maintenance when vibration drops below expected operating range
        condition:
          type: object
          description: Condition json description
          additionalProperties: true
          example:
            type: leaf
            operator: gt
            threshold: 5
            window_seconds: 15
            occurances: 3
        action_config:
          type: array
          description: List of action configuration objects
          items:
            type: object
            additionalProperties: true
          example:
            - type: notification
              recipients: ["test@test.com"]
              template_id: 5
            - type: stop_machine
              machine_id: CNC-002
        last_triggered_at:
          type: string
          format: date-time
          example: 2026-01-16T17:30:00Z
        is_enabled:
          type: boolean
          description: is the rule enabled
          example: true
    Device:
      type: object
      required:
        - id
        - device_type_id
        - name
        - serial_number
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 5d0e2855-738d-4ed8-8fbf-7c8d9d2329c5
        device_type_id:
          type: string
          format: uuid
          example: 7ca821df-4d26-4eb6-bd4f-426b6e2f08c8
        name:
          type: string
          example: Sensor 1
        serial_number:
          type: string
          example: SN-001
        location:
          type: string
          nullable: true
          example: Lab
        status:
          type: string
          enum: [active, inactive, error]
          example: active
        last_seen:
          type: string
          format: date-time
          nullable: true
          example: "2026-01-27T20:58:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-01-27T20:57:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-27T21:10:00Z"

    DeviceCreate:
      type: object
      required:
        - device_type_id
        - name
        - serial_number
      properties:
        device_type_id:
          type: string
          format: uuid
          example: 7ca821df-4d26-4eb6-bd4f-426b6e2f08c8
        name:
          type: string
          example: Sensor 1
        serial_number:
          type: string
          example: SN-001
        location:
          type: string
          nullable: true
          example: Lab
        status:
          type: string
          enum: [active, inactive, error]
          example: active

    DeviceUpdate:
      type: object
      description: Partial update (all fields optional)
      properties:
        device_type_id:
          type: string
          format: uuid
          example: 7ca821df-4d26-4eb6-bd4f-426b6e2f08c8
        name:
          type: string
          example: Sensor 1
        serial_number:
          type: string
          example: SN-001
        location:
          type: string
          nullable: true
          example: Lab
        status:
          type: string
          enum: [active, inactive, error]
          example: inactive

    DeviceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Device"
    RuleListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rules"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
  responses:
    UnauthorizedError:
      description: No or invalid JWT token provided
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
