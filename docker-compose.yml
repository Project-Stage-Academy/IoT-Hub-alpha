x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: iot_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iot_hub_alpha_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 30s
      retries: 5
    logging: *default-logging
    networks:
      - iot_hub_net
    # TODO: add backup/restore strategy for postgres_data

  web:
    build: ./backend
    container_name: iot_hub_web
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - iot_hub_net
    # TODO: add production server (gunicorn) and static/media handling

  proxy:
    build:
      context: ./nginx
    container_name: iot_hub_proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/certs:/etc/ssl/certs:ro
    depends_on:
      - web
    networks:
      - iot_hub_net

  migrate:
    build: ./backend
    container_name: iot_hub_migrate
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: python manage.py migrate
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - iot_hub_net
    # Run once: docker compose run --rm migrate

  redis:
    image: redis:7-alpine
    container_name: iot_hub_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
    # TODO: configure redis auth, persistence, and memory policy
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - iot_hub_net

  worker:
    build: ./backend
    container_name: iot_hub_worker
    entrypoint: ["/app/scripts/entrypoint.sh"]
    # Use --pool=gevent for I/O-bound tasks or --pool=prefork for CPU-bound tasks.
    command: celery -A config worker -l info --pool=solo --concurrency=4
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
        
    logging: *default-logging
    networks:
      - iot_hub_net
    # TODO: add celery config and queues

  beat:
    build: ./backend
    container_name: iot_hub_beat
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
        
    logging: *default-logging
    networks:
      - iot_hub_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: iot_hub_prometheus
    profiles: ["monitoring"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./devops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web
    logging: *default-logging
    networks:
      - iot_hub_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: iot_hub_grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./devops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    env_file:
      - .env
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - iot_hub_net
      
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_hub_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: mosquitto -c /mosquitto-no-auth.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    networks:
      - iot_hub_net

  mqtt_adapter:
    build: ./backend
    container_name: iot_hub_mqtt_adapter
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: python manage.py mqtt_adapter
    env_file:
      - .env
    depends_on:
      mosquitto:
        condition: service_healthy
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - iot_hub_net

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    working_dir: /app
    volumes:
      - ./simulator:/app/simulator
    depends_on:
      - web
    networks:
      - iot_hub_net

networks:
  iot_hub_net:
    name: iot_hub_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  mosquitto_data:
  mosquitto_log:
