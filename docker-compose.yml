x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: iot_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iot_hub_alpha_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 30s
      retries: 5
    logging: *default-logging
    networks:
      - iot_hub_net
    # TODO: add backup/restore strategy for postgres_data

  web:
    build: ./backend
    container_name: iot_hub_web
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - iot_hub_net
    # TODO: add production server (gunicorn) and static/media handling

  proxy:
    build:
      context: ./nginx
    container_name: iot_hub_proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/certs:/etc/ssl/certs:ro
      - ./frontend:/var/www/frontend:ro
    depends_on:
      - web
    networks:
      - iot_hub_net

  migrate:
    build: ./backend
    container_name: iot_hub_migrate
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: python manage.py migrate
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - iot_hub_net
    # Run once: docker compose run --rm migrate

  redis:
    image: redis:7-alpine
    container_name: iot_hub_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
    # TODO: configure redis auth, persistence, and memory policy
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - iot_hub_net

  worker:
    build: ./backend
    container_name: iot_hub_worker
    entrypoint: ["/app/scripts/entrypoint.sh"]
    # Use --pool=gevent for I/O-bound tasks or --pool=prefork for CPU-bound tasks.
    command: celery -A config worker -l info --pool=solo --concurrency=4
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
        
    logging: *default-logging
    networks:
      - iot_hub_net
    # TODO: add celery config and queues

  beat:
    build: ./backend
    container_name: iot_hub_beat
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
        
    logging: *default-logging
    networks:
      - iot_hub_net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: iot_hub_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    networks:
      - iot_hub_net

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: iot_hub_kafka_init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPICS: ${KAFKA_TOPICS:-telemetry.raw,telemetry.clean,telemetry.dlq,event.topic}
    command: >
      /bin/sh -c '
      attempt=1;
      until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
        if [ "$$attempt" -ge 30 ]; then
          echo "Kafka broker was not ready after 30 attempts";
          exit 1;
        fi;
        echo "Waiting for Kafka broker... attempt $$attempt/30";
        attempt=$$((attempt + 1));
        sleep 2;
      done;
      for topic in $$(echo "$$KAFKA_TOPICS" | tr "," " "); do
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1;
      done;
      echo "Kafka topics ready:";
      kafka-topics --bootstrap-server kafka:9092 --list;
      '
    logging: *default-logging
    networks:
      - iot_hub_net

  db-writer:
    build: ./backend
    command: python manage.py db_writer
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iot_hub_net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: iot_hub_kafka_ui
    restart: unless-stopped
    profiles: ["kafka-ui"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    logging: *default-logging
    networks:
      - iot_hub_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: iot_hub_prometheus
    profiles: ["monitoring"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./devops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web
    logging: *default-logging
    networks:
      - iot_hub_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: iot_hub_grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./devops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    env_file:
      - .env
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - iot_hub_net
      
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_hub_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./devops/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    networks:
      - iot_hub_net

  mqtt_adapter:
    build: ./backend
    container_name: iot_hub_mqtt_adapter
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: python manage.py mqtt_adapter
    env_file:
      - .env
    depends_on:
      mosquitto:
        condition: service_healthy
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - iot_hub_net

  rules_consumer:
    build: ./backend
    container_name: iot_hub_rules_consumer
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: >-
      python manage.py rules_consumer
      --input-topic telemetry.clean
      --output-topic event.topic
      --group-id rules-evaluator
      --metrics-port 9101
    expose:
      - "9101"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - iot_hub_net

  events_consumer:
    build: ./backend
    container_name: iot_hub_events_consumer
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: >-
      python manage.py events_consumer
      --input-topic event.topic
      --group-id events-processor
      --metrics-port 9102
    expose:
      - "9102"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - iot_hub_net

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    working_dir: /app
    volumes:
      - ./simulator:/app/simulator
    depends_on:
      - web
    networks:
      - iot_hub_net

networks:
  iot_hub_net:
    name: iot_hub_net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  mosquitto_data:
  mosquitto_log:
