name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches:
      - "main"
      - "develop"
      - "feature/**"
      - "task-**"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install yamllint

      - name: Lint (black)
        run: black --check backend

      - name: Lint (flake8)
        run: flake8 backend

      - name: Lint OpenAPI
        uses: stoplightio/spectral-action@v0.8.11
        with:
          file_glob: "docs/api.yaml"

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/api.yaml

  config-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          pip install yamllint

      - name: Validate Prometheus YAML
        run: yamllint devops/prometheus.yml

      - name: Validate Grafana Datasources YAML
        run: yamllint devops/grafana/provisioning/datasources/

      - name: Validate Grafana Dashboards JSON
        run: |
          for file in devops/grafana/provisioning/dashboards/*.json; do
            python3 -m json.tool "$file" > /dev/null || (echo "Invalid JSON in $file" && exit 1)
          done

      - name: Validate Grafana Provisioning Config YAML
        run: yamllint devops/grafana/provisioning/dashboards/

  prism-newman:
    runs-on: ubuntu-latest
    needs: [lint, config-validation]
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      SPEC_PATH: docs/api.yaml
      POSTMAN_COLLECTION: docs/postman/postman_collection.json
      PRISM_HOST: 127.0.0.1
      PRISM_PORT: "4010"
      BASE_URL: http://127.0.0.1:4010

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set npm cache dir
        run: npm config set cache ~/.npm --global

      - name: Cache npm downloads (global tools)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-tools-node20-${{ hashFiles('.github/npm-tools.txt') }}
          restore-keys: |
            ${{ runner.os }}-npm-tools-node20-

      - name: Install CLI tools
        run: |
          npm i -g @redocly/cli newman
          npm i -g @stoplight/prism-cli

      - name: Start Prism mock server
        run: |
          prism mock "${SPEC_PATH}" --dynamic -h "${PRISM_HOST}" -p "${PRISM_PORT}" > prism.log 2>&1 &
          echo $! > prism.pid

      - name: Wait for Prism to be ready
        run: |
          set -euo pipefail
          # Probe a real endpoint under your server base path (/api/v1)
          for i in {1..80}; do
            if curl -fsS "${BASE_URL}/auth/fake" >/dev/null 2>&1; then
              echo "Prism is up"
              exit 0
            fi
            sleep 0.25
          done

          echo "Prism did not start in time"
          echo "---- prism.log (tail) ----"
          tail -n 200 prism.log || true
          exit 1

      - name: Inject tests
        run: |
          python scripts/postman_rule_inject.py docs/postman/postman_collection.json

      - name: Run Newman against Prism
        run: |
          newman run ${POSTMAN_COLLECTION} \
            --env-var "baseUrl=${BASE_URL}" \
            --bail \
            --color off

      - name: Stop Prism
        if: always()
        run: |
          if [ -f prism.pid ]; then
            kill "$(cat prism.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload Prism logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prism-log
          path: prism.log

  tests:
    runs-on: ubuntu-latest
    needs: [lint, config-validation]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: iot_hub_alpha_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-secret-key' }}
      DJANGO_SETTINGS_MODULE: config.settings.base
      DB_NAME: iot_hub_alpha_db
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      DB_CONNECT_TIMEOUT: "10"
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        working-directory: backend
        run: >
          pytest -q --maxfail=1
          --cov=apps.devices
          --cov=apps.telemetry
          --cov=apps.rules
          --cov=apps.events
          --cov=apps.notifications
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --cov-fail-under=80

      - name: Upload coverage XML artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

      - name: Upload coverage HTML artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov

  build:
    runs-on: ubuntu-latest
    needs: [tests, prism-newman]
    steps:
      - uses: actions/checkout@v4
      - name: Build Django image
        run: |
          docker build -f backend/Dockerfile \
            --cache-from iot-hub-backend:ci \
            -t iot-hub-backend:ci backend

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "iot-hub-backend:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
