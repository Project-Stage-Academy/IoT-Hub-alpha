name: Mock contract (Prism + Schemathesis)

on:
  push:
    branches:
      - 45-api-documentation-mock-server-and-openapi-completeness
    paths:
      - "docs/api.yaml"
      - ".github/workflows/mock-contract.yml"
      - "scripts/**"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          npm i -g @redocly/cli newman

      # 1) Ensure spec + examples are valid (same as lint job)
      - name: Lint OpenAPI (fails on invalid examples)
        run: redocly lint docs/api.yaml

      # 3) Run Postman collection against the Redocly mock server
      - name: Run contract (Postman collection)
        env:
          BASE_URL: https://iot-industry.redocly.app/_mock/openapi
        run: |
          # IMPORTANT: set your Postman env's baseUrl to the mock path:
          # e.g. http://127.0.0.1:4000/_mock/openapi/api/
          newman run docs/postman/postman_collection.json \
            -e docs/postman/postman_environment.json

      - name: Stop preview
        if: always()
        run: |
          kill $(cat preview.pid) || true