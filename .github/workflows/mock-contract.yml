name: Mock contract (Prism + Schemathesis)

on:
  push:
    branches:
      - 45-api-documentation-mock-server-and-openapi-completeness
    paths:
      - "docs/api.yaml"
      - ".github/workflows/mock-contract.yml"
      - "scripts/**"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Contract smoke
        run: |
          chmod +x scripts/contract-smoke.sh
          BASE_URL="https://iot-industry.redocly.app/_mock/openapi" \
          scripts/contract-smoke.sh

      - name: Stop preview
        if: always()
        run: |
          kill $(cat preview.pid) || true