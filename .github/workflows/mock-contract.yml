name: Mock contract (Prism + Schemathesis)

on:
  push:
    branches:
      - 45-api-documentation-mock-server-and-openapi-completeness
    paths:
      - "docs/api.yaml"
      - ".github/workflows/mock-contract.yml"
      - "scripts/**"
  workflow_dispatch:

jobs:
  prism-schemathesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Schemathesis
        run: |
          python -m pip install --upgrade pip
          pip install schemathesis

      - name: Setup Node (for npx Prism)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start Prism mock server
        run: |
          npx -y @stoplight/prism-cli@latest mock docs/api.yaml -h 0.0.0.0 -p 4010 > prism.log 2>&1 &
          echo $! > prism.pid

      - name: Wait for Prism to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4010 >/dev/null 2>&1; then
              echo "Prism is up"
              exit 0
            fi
            sleep 1
          done
          echo "Prism failed to start"
          echo "---- prism.log ----"
          cat prism.log || true
          exit 1

      - name: Run Schemathesis against Prism
        run: |
          # Use ONE of these blocks depending on your Schemathesis version.
          schemathesis run docs/api.yaml \
            --url=http://localhost:4010 \
            --max-examples=10 \
            --checks=all \
            --exclude-checks=unsupported_method \
            --exclude-checks=missing_required_header \
            --exclude-checks=ignored_auth

      - name: Show Prism logs on failure
        if: failure()
        run: |
          echo "---- prism.log ----"
          cat prism.log || true

      - name: Stop Prism
        if: always()
        run: |
          if [ -f prism.pid ]; then
            kill "$(cat prism.pid)" || true
          fi